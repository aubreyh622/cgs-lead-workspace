<title>CGS Lead Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: a quiet work shell (left rail + page) whose one signature element is the
   eight-step workflow track, coloured by who does each step (Human / AI / AI + Human). */
:root{
  --paper:#f4f6f9;          /* page ground, cool grey with a blue bias */
  --surface:#ffffff;        /* panels */
  --sunken:#eef1f5;         /* wells, inputs, quiet fills */
  --line:#dfe4eb;           /* hairlines */
  --line-strong:#c9d1dc;
  --ink:#152132;            /* primary text, primary buttons */
  --ink-2:#3d4a5c;          /* secondary text */
  --muted:#576375;          /* captions */
  --brand:#e5671f;          /* CGS orange: brand mark + current step only */
  --brand-soft:#fdeee4;
  --human:#244b8a;          /* step actor: Human */
  --human-soft:#e7eef9;
  --ai:#6a4bc4;             /* step actor: AI */
  --ai-soft:#efeafb;
  --good:#1f6d44; --good-soft:#e3f2e9;
  --warn:#7f5600; --warn-soft:#fbf1d6; --warn-dot:#d9a400;
  --bad:#b5362c;  --bad-soft:#fbe8e6;
  --focus:#2f6fe0;
  --shadow:0 1px 2px rgba(21,33,50,.06),0 8px 24px rgba(21,33,50,.08);
  --font-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e131a; --surface:#151c26; --sunken:#1b2431; --line:#263142; --line-strong:#334156;
  --ink:#e7ecf3; --ink-2:#c1cad6; --muted:#8f9bad;
  --brand:#f08443; --brand-soft:#3a2416;
  --human:#7fa6ea; --human-soft:#1b2a44; --ai:#a990f0; --ai-soft:#2a2245;
  --good:#5cc08a; --good-soft:#15301f; --warn:#e2b23c; --warn-soft:#352a10; --warn-dot:#e2b23c;
  --bad:#ee7b70; --bad-soft:#3a1a17; --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e131a; --surface:#151c26; --sunken:#1b2431; --line:#263142; --line-strong:#334156;
  --ink:#e7ecf3; --ink-2:#c1cad6; --muted:#8f9bad;
  --brand:#f08443; --brand-soft:#3a2416;
  --human:#7fa6ea; --human-soft:#1b2a44; --ai:#a990f0; --ai-soft:#2a2245;
  --good:#5cc08a; --good-soft:#15301f; --warn:#e2b23c; --warn-soft:#352a10; --warn-dot:#e2b23c;
  --bad:#ee7b70; --bad-soft:#3a1a17; --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--human)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;
  padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-2);text-align:left;font-weight:500}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--sunken);color:var(--ink);font-weight:600}
.nav button[aria-current="page"] svg{color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;text-align:center}
.nav .count.quiet{background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.demo-note{font-size:12.5px;color:var(--ink-2);background:var(--sunken);border-radius:10px;padding:10px 12px;line-height:1.45}
.demo-note b{display:block;color:var(--ink);font-size:12.5px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--human-soft);color:var(--human);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me b{display:block;font-size:13.5px;line-height:1.2}.me small{color:var(--muted);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;height:56px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.menu-btn{display:none}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.search svg{width:16px;height:16px;flex:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill-demo{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.page{padding-block:26px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1360px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.page-head p{color:var(--ink-2);margin-top:6px;max-width:68ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.92}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);min-height:40px}
textarea.input{resize:vertical;line-height:1.55}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.ai-filled{position:relative}
.ai-filled .input{border-color:color-mix(in srgb,var(--ai) 45%,var(--line-strong));background:color-mix(in srgb,var(--ai-soft) 45%,var(--surface))}
.tag-ai{font-size:11.5px;font-weight:600;color:var(--ai);display:inline-flex;align-items:center;gap:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.tabs .count{font-size:12px;padding:0 7px;border-radius:999px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sunken);color:var(--ink)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{font-size:15.5px}
.panel-b{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sect-title{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* chips and states */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.stage{background:var(--sunken);color:var(--ink-2);border-color:var(--line)}
.chip.ready{background:var(--good-soft);color:var(--good)}
.chip.more{background:var(--warn-soft);color:var(--warn)}.chip.more .dot{background:var(--warn-dot)}
.chip.notready{background:var(--bad-soft);color:var(--bad)}
.chip.flag{background:var(--warn-soft);color:var(--warn)}
.chip.src{background:var(--sunken);color:var(--ink-2)}
.chip.src-ai{background:var(--ai-soft);color:var(--ai)}
.chip.human{background:var(--human-soft);color:var(--human)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.both{background:linear-gradient(90deg,var(--human-soft) 50%,var(--ai-soft) 50%);color:var(--ink)}
.overdue{color:var(--bad);font-weight:600}
.soon{font-weight:700}

/* actor legend dots */
.actor{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.actor i{width:10px;height:10px;border-radius:3px;display:inline-block}
.actor .h{background:var(--human)}.actor .a{background:var(--ai)}
.actor .b{background:linear-gradient(90deg,var(--human) 50%,var(--ai) 50%)}

/* ---------- workflow track (signature) ---------- */
.track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.step{position:relative;padding:10px 10px 9px;border-radius:9px;background:var(--sunken);min-width:0;border:1px solid transparent}
.step .bar{height:4px;border-radius:2px;margin-bottom:8px;opacity:.35}
.step .bar.h{background:var(--human)}.step .bar.a{background:var(--ai)}
.step .bar.b{background:linear-gradient(90deg,var(--human) 50%,var(--ai) 50%)}
.step b{display:block;font-size:12.5px;line-height:1.25;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step span{display:block;font-size:11.5px;color:var(--muted)}
.step.done .bar{opacity:1}.step.done b{color:var(--ink-2)}
.step.done span::after{content:" \2713";color:var(--good);font-weight:700}
.step.now{background:var(--surface);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.step.now .bar{opacity:1}.step.now b{color:var(--ink)}
.step.now span{color:var(--brand);font-weight:700}
.track-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}

/* ---------- pipeline ---------- */
.todo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.todo button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.todo button:hover{border-color:var(--line-strong)}
.todo button:focus-visible{outline:2px solid var(--focus)}
.todo strong{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.todo span{font-size:13px;color:var(--ink-2)}
.todo .alert strong{color:var(--bad)}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr)) 180px;gap:14px;min-width:1000px}
.col{background:var(--sunken);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col-h{display:flex;align-items:baseline;justify-content:space-between;padding:4px 6px 6px}
.col-h b{font-size:14px}.col-h small{color:var(--muted);font-size:12px}
.col-h .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.col.nurture{background:none;border:1px dashed var(--line-strong)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 1px 1px rgba(21,33,50,.03)}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--focus)}
.card .who{font-weight:600;line-height:1.3}
.card .co{font-size:13px;color:var(--ink-2)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);align-items:center}
.card .next{font-size:13px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px}
.card .next span:first-child{color:var(--ink-2);min-width:0}
.card.star{border-color:var(--brand)}
.attn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ai);font-weight:600}
.attn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ai)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.list{width:100%;border-collapse:collapse;min-width:820px;font-size:14px}
table.list th{font-size:12.5px;text-align:left;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--sunken)}

/* ---------- discover ---------- */
.intent{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.examples{display:flex;flex-direction:column;gap:8px}
.example{all:unset;cursor:pointer;font-size:13px;line-height:1.45;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink-2);background:var(--surface)}
.example:hover{border-color:var(--line-strong);color:var(--ink)}
.example:focus-visible{outline:2px solid var(--focus)}
.cands{display:flex;flex-direction:column}
.cand{display:grid;grid-template-columns:28px minmax(0,1.25fr) minmax(0,1.5fr) auto;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:start}
.cand:last-child{border-bottom:0}
.cand.sel{background:color-mix(in srgb,var(--human-soft) 55%,var(--surface))}
.cand input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}
.cand .co{font-weight:600;font-size:15px}
.cand .person{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.cand .why{font-size:13.5px;color:var(--ink-2)}
.cand .sig{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.cand .acts{display:flex;gap:6px}
.bulkbar{position:sticky;bottom:16px;z-index:4;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);margin-top:14px}
.bulkbar .btn{background:transparent;color:var(--surface);border-color:color-mix(in srgb,var(--surface) 35%,transparent)}
.bulkbar .btn.primary{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.side-stat{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.side-stat:last-child{border-bottom:0}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);padding:26px;text-align:center;background:var(--sunken)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.map-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.map-table th,.map-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.map-table th{font-size:12.5px;color:var(--muted)}
.prog-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 150px;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.prog-row:last-child{border-bottom:0}
.substeps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.sub{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);min-width:0}
.sub i{height:6px;border-radius:3px;background:var(--line)}
.sub.done i{background:var(--ai)}
.sub.run i{background:linear-gradient(90deg,var(--ai) 0 50%,var(--line) 50%);background-size:200% 100%;animation:run 1.2s linear infinite}
.sub.flag i{background:var(--warn-dot)}
.sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes run{from{background-position:100% 0}to{background-position:0 0}}
.log{font-size:13px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;padding:10px 12px;border-radius:10px;background:var(--sunken)}
.log div{display:grid;grid-template-columns:58px 1fr;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- decisions ---------- */
.master{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.qlist{display:flex;flex-direction:column}
.qitem{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem:hover{background:var(--sunken)}
.qitem[aria-current="true"]{background:var(--sunken);box-shadow:inset 3px 0 0 var(--ink)}
.qitem:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.qitem .t{font-weight:600}.qitem .s{font-size:13px;color:var(--ink-2)}
.qitem .r{display:flex;gap:6px;flex-wrap:wrap}
.verdict{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-md);background:var(--ai-soft);border:1px solid color-mix(in srgb,var(--ai) 25%,transparent)}
.verdict .ico{width:34px;height:34px;border-radius:9px;background:var(--ai);color:#fff;display:grid;place-items:center;flex:none}
.verdict .ico svg{width:18px;height:18px}

.flagbox{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:14px}

.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}

/* ---------- lead page ---------- */
.lead-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px}
.lead-id{display:flex;gap:14px;align-items:center}

.lead-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.back{all:unset;cursor:pointer;color:var(--ink-2);font-size:13.5px;display:inline-flex;gap:6px;align-items:center;margin-bottom:12px}

.rail-box{display:flex;flex-direction:column;gap:12px}

.angle:focus-visible{outline:2px solid var(--focus)}
.draft{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface)}
.draft-subj{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}

.draft-body{padding:16px;min-height:240px;white-space:pre-wrap;line-height:1.65;outline:0}

.cite{background:var(--human-soft);border-bottom:1.5px solid var(--human);padding:0 2px;border-radius:2px;cursor:help}
.cite sup{font-size:10px;font-weight:700;color:var(--human);margin-left:1px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:86px 18px minmax(0,1fr);gap:10px;padding:8px 0}

.tl i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line-strong);justify-self:center}
.tl i.h{background:var(--human)}.tl i.a{background:var(--ai)}

.finding{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}

.finding.ok{background:color-mix(in srgb,var(--good-soft) 50%,var(--surface))}
.finding.no{opacity:.6}
.cond{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.cond:last-child{border-bottom:0}
.cond .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}

.cond .st.b{background:var(--bad-soft);color:var(--bad)}
.big-verdict{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r-lg)}
.big-verdict.ready{background:var(--good-soft)}.big-verdict.more{background:var(--warn-soft)}.big-verdict.notready{background:var(--bad-soft)}

.big-verdict p{color:var(--ink-2);font-size:14px}
details.more-d{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}

.pack{display:flex;flex-direction:column;gap:0}

.pack .pk:last-child{border-bottom:0}
.pack .pk dt{color:var(--muted);font-weight:600;font-size:13px}
.pack .pk dd{margin:0}

/* ---------- settings ---------- */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.linkrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.linkrow small{display:block;color:var(--muted);font-size:12.5px}
.linkrow:hover{border-color:var(--line-strong)}.linkrow:focus-visible{outline:2px solid var(--focus)}
.mono-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre}
i.pending{font-style:normal;color:var(--warn);background:var(--warn-soft);padding:0 5px;border-radius:4px}
.choice.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice label.dis{opacity:.5;cursor:not-allowed}
blockquote.q{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--line-strong);color:var(--ink-2);font-size:14px}
ul.gaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.gaps li{display:flex;flex-direction:column;font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--sunken)}
ul.gaps li span{color:var(--ink-2)}
.modal .mono-text{width:100%;resize:vertical}
@media (max-width:1180px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.scorebar{grid-template-columns:minmax(0,1fr)}.choice.two{grid-template-columns:minmax(0,1fr)}.sugg{flex-direction:column}}
@media (max-width:520px){.metrics{grid-template-columns:minmax(0,1fr)}}
.flagbox{align-items:flex-start}.flagbox .btn{margin-left:auto;flex:none}
.tl i.s{background:var(--muted)}

function measures() {
  const latest = {};
  S.feedback.filter(f => f.step === 4).forEach(f => { if (!latest[f.subject] || latest[f.subject].on <= f.on) latest[f.subject] = f; });
  const L = Object.values(latest), reviewed = L.length, acc = L.filter(f => f.outcome === 'Accepted').length;
  const mins = L.map(f => f.minutes).filter(m => m != null && m !== '').map(Number).sort((a, b) => a - b);
  const med = mins.length ? (mins.length % 2 ? mins[(mins.length - 1) / 2] : (mins[mins.length / 2 - 1] + mins[mins.length / 2]) / 2) : null;
  const out = S.leads.filter(l => l.outreach?.sentOn || hasQual(l)).length, rep = S.leads.filter(l => hasQual(l)).length;
  const opps = S.leads.filter(l => !['researching'].includes(l.stage)).length + S.feedback.filter(f => f.step === 4 && !S.leads.some(l => l.company.name === f.subject)).length;
  const pct = (a, b) => b ? `${a} of ${b}, ${Math.round(a / b * 100)}%` : 'Not measured';
  const M = [
    ['Opportunities', opps, 'Saved opportunities, including rejected ones'],
    ['Reviewed at Step 4', reviewed, 'Latest decision per opportunity'],
    ['Accepted at Step 4', pct(acc, reviewed), 'Latest decision was Accept'],
    ['Feedback records', S.feedback.length, 'All records, history included'],
    ['Median review time', med == null ? 'Not measured' : `${med} min`, `From ${mins.length} timed reviews. Blank times are left out, not counted as zero.`],
    ['Recorded outreach', out, 'Opportunities with a sent message recorded'],
    ['Recorded replies', pct(rep, out), 'Replies divided by recorded outreach'],
    ['Research tasks', S.leads.filter(l => l.stage === 'researching').length, `${S.leads.filter(l => l.paused || l.failed).length} paused or failed`],
  ];
  return `<div class="callout" style="margin-bottom:14px"><span><b>Workflow indicators, not proof of value.</b> These measure how the workflow is used. They do not show lead quality, conversion or time saved, and every record here is synthetic. Agree a baseline with CGS before setting targets.</span></div>

}

function setPath(path, value) {
  const parts = path.split('.');

  if (parts[0] === 'lead') { obj = lead(parts[1]); parts.splice(0, 2); }
  for (let i = 0; i < parts.length - 1; i++) { if (obj[parts[i]] == null) obj[parts[i]] = {}; obj = obj[parts[i]]; }
  obj[parts[parts.length - 1]] = value;
}
const root = document.getElementById('app');

  if (el.type === 'checkbox' && !['selCand', 'selAll', 'taskDone'].includes(act)) return;
  const h = handlers[act]; if (!h) return;
